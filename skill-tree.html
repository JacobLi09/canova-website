<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canova — English Skill Tree</title>
  <link rel="stylesheet" href="game.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Patrick+Hand&display=swap" rel="stylesheet">
</head>
<body class="skill-page">
  <header class="tree-header-wrap">
    <div class="page-topbar">
      <a href="game.html" class="back-link">← Back to dashboard</a>
    </div>
    <div class="tree-page-header">
      <div>
        <p class="eyebrow">Canova Learning Path</p>
        <h1>English Skill Tree</h1>
      </div>
      <button id="completeSkillBtn" class="btn primary">Mark as complete</button>
    </div>
  </header>

  <main class="tree-page-layout">
    <section class="tree-map-panel">
      <div class="tree-title-row">
        <h2>Skill branches</h2>
        <span class="subject-badge">English</span>
      </div>
      <div id="skillTreeMap" class="skill-tree-map" aria-live="polite"></div>
    </section>

    <aside class="skill-detail-panel">
      <p class="eyebrow">Skill focus</p>
      <h2 id="skillDetailTitle">Word Power</h2>
      <div id="skillDetailMeta" class="detail-meta"></div>
      <p id="skillDetailDescription" class="detail-description"></p>
      <h3>How to build this skill</h3>
      <ul id="skillDetailTasks" class="detail-tasks"></ul>
    </aside>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
